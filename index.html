<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naveenakrishnan S | Software Engineer</title>
    <meta
      name="description"
      content="Naveenakrishnan S, software engineer in Chennai: secure, scalable backend systems with Java, Spring Boot and FastAPI, plus cross-platform Flutter apps."
    />
    <meta name="author" content="Naveenakrishnan S" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="color-scheme" content="dark" />

    <!-- Link previews (LinkedIn, Slack, WhatsApp, X). scripts/prerender.js makes the image URL
         absolute and adds canonical / og:url when built with SITE_URL set. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Naveenakrishnan S" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Naveenakrishnan S | Software Engineer" />
    <meta
      property="og:description"
      content="Backend systems with Java, Spring Boot and FastAPI, and cross-platform apps with Flutter. Based in Chennai."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Naveenakrishnan S, Software Engineer, Chennai" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured data: facts from the user's LinkedIn profile only. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Naveenakrishnan S",
        "jobTitle": "Associate Software Engineer",
        "worksFor": { "@type": "Organization", "name": "Clarium Managed Services" },
        "address": { "@type": "PostalAddress", "addressLocality": "Chennai", "addressRegion": "Tamil Nadu", "addressCountry": "IN" },
        "knowsAbout": ["Java", "Spring Boot", "REST APIs", "Microservices", "Python", "FastAPI", "Flutter", "Firebase", "Angular"],
        "sameAs": ["https://www.linkedin.com/in/naveenakrishnan-s/", "https://github.com/NaveenakrishnanS"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
