<!DOCTYPE html>
<!-- Source for the PNG app icons. Rendered at 512x512 by tools/build-images.ps1, then resized.
     ?pad=0.18 is the default; ?pad=0.28 keeps the mark inside the maskable-icon safe zone. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; background: #0b0b0d; overflow: hidden; }
  body { display: grid; place-items: center; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="m" viewBox="0 0 124 100" aria-hidden="true">
  <rect x="8" y="10" width="20" height="80" fill="#F4F1EC"/>
  <polygon points="33,10 50,10 66,90 49,90" fill="#F4F1EC"/>
  <rect x="71" y="10" width="20" height="80" fill="#F4F1EC"/>
  <circle cx="107" cy="82" r="8" fill="#8AA4F5"/>
</svg>
<script>
  const pad = Number(new URLSearchParams(location.search).get('pad') || 0.18);
  document.getElementById('m').style.width = `${512 * (1 - pad * 2)}px`;
</script>
</body>
</html>
